name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🛠️ Test build
        run: pnpm build

      - name: Verify build is up-to-date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ is not up to date. run pnpm build locally and push the changes."
            exit 1
          fi

      - name: 🧪 Test project
        run: pnpm test
