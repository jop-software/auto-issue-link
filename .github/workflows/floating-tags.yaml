name: Update floating tags

permissions:
    contents: write

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to process (e.g. v1.2.3)"
                required: true
                type: string

jobs:
    update-tags:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Determine tag
              id: tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    TAG="${{ inputs.tag }}"
                  else
                    TAG="${GITHUB_REF_NAME}"
                  fi

                  echo "Using tag: $TAG"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Validate tag exists
              run: |
                  TAG="${{ steps.tag.outputs.tag }}"

                  git fetch --tags

                  if git rev-parse "$TAG^{tag}" >/dev/null 2>&1; then
                  echo "Tag $TAG exists."
                  else
                  echo "Tag $TAG does not exist in the repository."
                  exit 1
                  fi

            - name: Parse version
              id: version
              run: |
                  TAG="${{ steps.tag.outputs.tag }}"

                  if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Invalid tag format. Expected v<major>.<minor>.<patch>"
                    exit 1
                  fi

                  VERSION="${TAG#v}"
                  MAJOR="$(echo "$VERSION" | cut -d. -f1)"
                  MINOR="$(echo "$VERSION" | cut -d. -f2)"

                  echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
                  echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

            - name: Create / update major and minor tags
              run: |
                  TAG="${{ steps.tag.outputs.tag }}"
                  MAJOR="${{ steps.version.outputs.major }}"
                  MINOR="${{ steps.version.outputs.minor }}"

                  git fetch --tags

                  git tag -f "v$MAJOR" "$TAG"
                  git tag -f "v$MAJOR.$MINOR" "$TAG"

                  git push origin "v$MAJOR" --force
                  git push origin "v$MAJOR.$MINOR" --force
